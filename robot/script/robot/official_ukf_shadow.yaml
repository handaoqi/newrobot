# Shadow-only official robot_localization setup. publish_tf remains false so it
# cannot conflict with the production localization node until explicitly cut over.
local_ukf:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.25
    transform_time_offset: 0.25
    two_d_mode: true
    publish_tf: false
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom/mc_odom_sanitized
    odom0_config: [true, true, false, false, false, true, false, false, false, false, false, false, false, false, false]
    odom0_differential: true
    odom0_relative: false
    odom0_queue_size: 20
    imu0: /front_lidar/imu_sanitized
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 100

global_ukf:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    transform_time_offset: 0.25
    two_d_mode: true
    publish_tf: false
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    odom0: /odom/ndt_odom_sanitized
    odom0_config: [true, true, false, false, false, true, false, false, false, false, false, false, false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "navigo_behaviors/Spin"
    backup:
      plugin: "navigo_behaviors/BackUp"
    drive_on_heading:
      plugin: "navigo_behaviors/DriveOnHeading"
    wait:
      plugin: "navigo_behaviors/Wait"
    assisted_teleop:
      plugin: "navigo_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.00
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.40
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.80

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.315,0.18],[0.315,-0.18],[-0.315,-0.18],[-0.315,0.18]]"
      transform_tolerance: 1.00
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "navigo_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.50
      obstacle_layer:
        plugin: "navigo_costmap_2d::ObstacleLayer"
        # Keep the global RTK line as the route reference while this rolling
        # lidar layer lets MPPI make short local detours around live obstacles.
        enabled: True
        footprint_clearing_enabled: true
        observation_persistence: 0.3
        observation_sources: scan
        scan:
          topic: /laser_scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          # Input scan has calibrated robot-body returns removed upstream.
          obstacle_min_range: 0.18
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.315,0.18],[0.315,-0.18],[-0.315,-0.18],[-0.315,0.18]]"
      transform_tolerance: 1.00
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: "navigo_costmap_2d::StaticLayer"
        # map_server publishes the selected map before the global costmap
        # component can be activated.  Receive that retained map so
        # StaticLayer can resize the master costmap to the map's real origin
        # and dimensions instead of leaving Nav2's 5 x 5 m default grid.
        map_subscribe_transient_local: True
        footprint_clearing_enabled: True
        restore_cleared_footprint: True
      # Outdoor GPS patrol must not paint lidar hits onto the global map.
      # That is what made NavFn refuse a valid RTK waypoint (点7).
      # Local costmap + collision_monitor keep real-time lidar avoidance.
      inflation_layer:
        plugin: "navigo_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      keepout_filter:
        plugin: "navigo_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.2
      always_send_full_costmap: False

filter_mask_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/dogrobot/runtime/nx-edge/data/navigation_boundary/keepout_mask.yaml"
    topic_name: "keepout_filter_mask"
    frame_id: "map"

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0
    filter_info_topic: "costmap_filter_info"
    mask_topic: "keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: " "

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    odom_topic: /odom/nav2
    use_sim_time: False
    planner_plugins: ["ThetaStar", "NavFn", "SmacHybrid"]
    ThetaStar:
      plugin: "navigo_navfn_planner/ThetaStarPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      allow_straight_line_fallback: false
      prefer_straight_line: false
    NavFn:
      plugin: "navigo_navfn_planner/NavfnPlanner"
      # Indoor default: stay on the occupancy map and accept at most a small
      # reachable-cell adjustment. Edge switches to the 2.0 m straight-line
      # RTK profile only for outdoor/transition maps with a fixed GNSS origin.
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      allow_straight_line_fallback: false
      prefer_straight_line: false
    SmacHybrid:
      plugin: "navigo_navfn_planner/SmacHybridPlanner"
      tolerance: 0.20
      allow_unknown: true
      allow_straight_line_fallback: false
      prefer_straight_line: false
      angle_quantization_bins: 72
      minimum_turning_radius: 0.50
      step_size: 0.10
      max_iterations: 200000
      cost_penalty: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.20
      allow_reverse: false

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: "/odom/nav2"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath", "RPP", "ILQR"]

    # Progress checker parameters
    progress_checker:
      plugin: "navigo_path_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      # Fail FollowPath soon enough that BT Backup/replan runs before Edge
      # reverse. Collision Monitor can zero speed while the goal is still active.
      movement_time_allowance: 8.0
      # Rotation is progress even when XY is intentionally unchanged. Keep
      # stalled translation detection at 8 s, but allow heading alignment to
      # settle for up to 30 s on the quadruped platform.
      rotation_progress_enabled: true
      rotation_yaw_threshold: 0.03
      rotation_time_allowance: 30.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "navigo_path_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "navigo_path_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.50
      # Patrol routes use waypoints as pass-through points. Do not require the
      # robot to match each waypoint's yaw, otherwise it can stall while turning.
      yaw_goal_tolerance: 3.14
      required_yaw_goal_tolerance: 0.25
    # MPPI parameters
    FollowPath:
      plugin: "navigo_mppi_controller::MPPIController"
      # Candidate/optimal trajectory markers on /trajectories only. Keep it off:
      # rebuilding them at controller_frequency costs thousands of Marker
      # constructions per cycle. /transformed_global_plan (the local segment
      # being tracked, which navigation_rosbag.sh records) is published
      # regardless of this flag.
      visualize: false
      # Publish bounded P50/P90/P99/max cycle timing for every diagnostic bag.
      performance_log_interval_seconds: 10.0
      time_steps: 40
      model_dt: 0.05
      batch_size: 1200
      vx_std: 0.2
      vy_std: 0.2
      # GPS straight-line paths are 0.25 m. Keep yaw noise well below wz_max so
      # MPPI does not sample bang-bang left/right turns on an already-straight path.
      # Patrol cruise is applied by Edge Agent (0.30 / 0.35); keep the YAML
      # fallback in the same range so idle Nav2 is not more aggressive.
      wz_std: 0.04
      vx_max: 0.30
      # Forward-only until Edge writes a profile. Outdoor GPS cruise stays 0
      # so a heading disagreement cannot reverse down the route. Indoor cruise
      # still gets vx_min=-0.12 from Edge.
      vx_min: 0.0
      vy_max: 0.5
      wz_max: 0.35
      ax_max: 1.0
      ay_max: 1.0
      ax_min: -1.0
      az_max: 0.8
      iteration_count: 1
      prune_distance: 2.0   #1.7
      transform_tolerance: 1.00
      temperature: 0.3
      gamma: 0.03
      motion_model: "DiffDrive"
      # Dead knobs: no code in navigo_mppi_controller reads either name. The
      # marker switch is `visualize` above.
      visualize_all_sampled_traj: false
      visualize_optimized_traj: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.1667
      critics: [ "ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "GoalAngleCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic" ] #
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        # Patrol waypoint yaw is 0 (east). Requiring that heading within 0.5 m
        # of every pass-through point makes the robot reverse and spin in place.
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        # Do not over-penalize a turn around a temporary obstacle.
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        # Safe indoor fallback. Edge keeps this enabled for avoidance legs and
        # lowers cost_weight to 8 for outdoor RTK without weakening collision_cost.
        enabled: true
        cost_power: 2
        # Was 35: outdoor grass/scan noise made MPPI weave off the RTK path.
        cost_weight: 18.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        # Low-weight indoor return-to-path pull. Edge disables it for outdoor
        # RTK cruise, where small GNSS/polyline variations otherwise cause weave.
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.20
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # Was 20, tuned for NavFn 0.05 m points (~1 m). Straight-line GPS paths
        # are 0.25 m, so 20 points delayed alignment until ~5 m and the dog weaved.
        offset_from_furthest: 4
        # Path yaw from hand-clicked vias weaves even when XY is almost straight.
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        # Was 1.0 (~57 deg): heading already "close enough" skipped this critic
        # on a straight GPS line, so sampled yaw commands were not pulled back.
        max_angle_to_furthest: 0.30
        mode: 0
        forward_preference: true
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0

    # Deterministic low-latency alternative to MPPI. Edge selects this plugin
    # for short, precise or resource-constrained legs.
    RPP:
      plugin: "navigo_mppi_controller::RPPController"
      desired_linear_vel: 0.22
      min_linear_vel: 0.05
      lookahead_dist: 1.2
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.8
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 2.5
      max_angular_vel: 0.30
      rotate_to_heading_threshold: 0.52
      rotate_to_heading_angular_vel: 0.22
      use_regulated_linear_velocity_scaling: true
      angular_deadband: 0.03

    ILQR:
      plugin: "navigo_mppi_controller::ILQRController"
      desired_linear_vel: 0.20
      max_angular_vel: 0.35
      model_dt: 0.05
      time_steps: 24
      iteration_count: 4
      position_weight: 8.0
      yaw_weight: 3.0
      velocity_weight: 0.6
      angular_weight: 0.4


smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: [ "savitzky_golay", "simple_smoother", "passthrough_smoother" ]
    savitzky_golay:
      plugin: "navigo_smoother::SavitzkyGolaySmoother"
      refinement_passes: 2
      max_point_deviation: 0.30
    simple_smoother:
      plugin: "navigo_smoother::SimpleSmoother"
      tolerance: 1.0e-6
      max_its: 200
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: False
    passthrough_smoother:
      plugin: "navigo_smoother::PassthroughSmoother"

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odom/nav2
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "navigo_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_optimizer:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.5]
    min_velocity: [-0.12, -0.5, -0.5]
    deadband_velocity: [0.0, 0.0, 0.03]
    velocity_timeout: 1.0
    manual_assist_timeout: 0.65
    manual_assist_max_velocity: [0.10, 0.10, 0.25]
    max_accel: [1.5, 1.0, 0.8]
    max_decel: [-1.5, -1.0, -0.8]
    odom_topic: "/odom/nav2"
    odom_duration: 0.1
    use_realtime_priority: false
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 1.0
    source_timeout: 0.50
    base_shift_correction: false
    stop_pub_timeout: 2.0
    stop_confirmation_cycles: 1
    # Direction-scoped polygons below protect recovery movement directly;
    # never bypass a stop decision just because it is a rotation or reverse.
    allow_rotation_recovery: false
    allow_reverse_recovery: false
    localization_topic: "/localization_info"
    localization_timeout: 0.75
    require_healthy_localization: true
    polygons: ["PolygonStop", "PolygonSlow", "PolygonRearStop", "PolygonRearSlow", "PolygonLeftStop", "PolygonRightStop", "PolygonRotationStop"]
    PolygonStop:
      type: "polygon"
      # Last-resort collision brake. Start in front of the body so lidar zero
      # returns and self-reflections do not trigger an emergency stop.
      # Keep this closer than MPPI's detour horizon so CostCritic can yaw
      # around a box before the last-resort stop. Slowdown still starts at 1.2 m.
      points: [0.68, 0.22, 0.68, -0.22, 0.55, -0.22, 0.55, 0.22]
      action_type: "stop"
      motion_scope: "forward"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: [1.20, 0.30, 1.20, -0.30, 0.55, -0.30, 0.55, 0.30]
      action_type: "slowdown"
      motion_scope: "forward"
      max_points: 5
      slowdown_ratio: 0.70
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    PolygonRearStop:
      type: "polygon"
      points: [-0.55, 0.22, -0.55, -0.22, -0.68, -0.22, -0.68, 0.22]
      action_type: "stop"
      motion_scope: "reverse"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_rear_stop"
      enabled: true
    PolygonRearSlow:
      type: "polygon"
      points: [-0.55, 0.30, -0.55, -0.30, -1.00, -0.30, -1.00, 0.30]
      action_type: "slowdown"
      motion_scope: "reverse"
      max_points: 5
      slowdown_ratio: 0.70
      visualize: true
      polygon_pub_topic: "polygon_rear_slowdown"
      enabled: true
    PolygonLeftStop:
      type: "polygon"
      points: [0.35, 0.55, -0.35, 0.55, -0.35, 0.18, 0.35, 0.18]
      action_type: "stop"
      motion_scope: "left"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_left_stop"
      enabled: true
    PolygonRightStop:
      type: "polygon"
      points: [0.35, -0.18, -0.35, -0.18, -0.35, -0.55, 0.35, -0.55]
      action_type: "stop"
      motion_scope: "right"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_right_stop"
      enabled: true
    PolygonRotationStop:
      type: "circle"
      radius: 0.48
      action_type: "stop"
      motion_scope: "rotation"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_rotation_stop"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/laser_scan"
      enabled: true
      cache_by_stamp: true
      performance_log_interval_seconds: 10.0

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom/nav2
    transform_tolerance: 1.0
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # navigo_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # navigo_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "navigo_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: "navigo_bt_navigator::NavigateThroughPosesNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1669
    plugin_lib_names:
      - navigo_compute_path_to_pose_action_bt_node
      - navigo_compute_path_through_poses_action_bt_node
      - navigo_smooth_path_action_bt_node
      - navigo_smoother_selector_bt_node
      - navigo_recovery_lease_scope_bt_node
      - navigo_fault_diagnose_bt_node
      - navigo_smart_rtk_wait_bt_node
      - navigo_set_ukf_weight_bt_node
      - navigo_adaptive_spin_bt_node
      - navigo_search_laser_feature_bt_node
      - navigo_follow_path_action_bt_node
      - navigo_spin_action_bt_node
      - navigo_wait_action_bt_node
      - navigo_assisted_teleop_action_bt_node
      - navigo_back_up_action_bt_node
      - navigo_drive_on_heading_bt_node
      - navigo_clear_costmap_service_bt_node
      - navigo_is_stuck_condition_bt_node
      - navigo_goal_reached_condition_bt_node
      - navigo_goal_updated_condition_bt_node
      - navigo_globally_updated_goal_condition_bt_node
      - navigo_is_path_valid_condition_bt_node
      - navigo_initial_pose_received_condition_bt_node
      - navigo_reinitialize_global_localization_service_bt_node
      - navigo_rate_controller_bt_node
      - navigo_distance_controller_bt_node
      - navigo_speed_controller_bt_node
      - navigo_truncate_path_action_bt_node
      - navigo_truncate_path_local_action_bt_node
      - navigo_goal_updater_node_bt_node
      - navigo_recovery_node_bt_node
      - navigo_pipeline_sequence_bt_node
      - navigo_round_robin_node_bt_node
      - navigo_transform_available_condition_bt_node
      - navigo_time_expired_condition_bt_node
      - navigo_path_expiring_timer_condition
      - navigo_distance_traveled_condition_bt_node
      - navigo_single_trigger_bt_node
      - navigo_goal_updated_controller_bt_node
      - navigo_is_battery_low_condition_bt_node
      - navigo_navigate_through_poses_action_bt_node
      - navigo_navigate_to_pose_action_bt_node
      - navigo_remove_passed_goals_action_bt_node
      - navigo_planner_selector_bt_node
      - navigo_path_controller_selector_bt_node
      - navigo_goal_checker_selector_bt_node
      - navigo_path_controller_cancel_bt_node
      - navigo_path_longer_on_approach_bt_node

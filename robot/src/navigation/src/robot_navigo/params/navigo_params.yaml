bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom/nav2
    transform_tolerance: 1.0
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # navigo_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # navigo_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "navigo_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: "navigo_bt_navigator::NavigateThroughPosesNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1669
    plugin_lib_names:
      - navigo_compute_path_to_pose_action_bt_node
      - navigo_compute_path_through_poses_action_bt_node
      - navigo_smooth_path_action_bt_node
      - navigo_follow_path_action_bt_node
      - navigo_spin_action_bt_node
      - navigo_wait_action_bt_node
      - navigo_assisted_teleop_action_bt_node
      - navigo_back_up_action_bt_node
      - navigo_drive_on_heading_bt_node
      - navigo_clear_costmap_service_bt_node
      - navigo_is_stuck_condition_bt_node
      - navigo_goal_reached_condition_bt_node
      - navigo_goal_updated_condition_bt_node
      - navigo_globally_updated_goal_condition_bt_node
      - navigo_is_path_valid_condition_bt_node
      - navigo_initial_pose_received_condition_bt_node
      - navigo_reinitialize_global_localization_service_bt_node
      - navigo_rate_controller_bt_node
      - navigo_distance_controller_bt_node
      - navigo_speed_controller_bt_node
      - navigo_truncate_path_action_bt_node
      - navigo_truncate_path_local_action_bt_node
      - navigo_goal_updater_node_bt_node
      - navigo_recovery_node_bt_node
      - navigo_pipeline_sequence_bt_node
      - navigo_round_robin_node_bt_node
      - navigo_transform_available_condition_bt_node
      - navigo_time_expired_condition_bt_node
      - navigo_path_expiring_timer_condition
      - navigo_distance_traveled_condition_bt_node
      - navigo_single_trigger_bt_node
      - navigo_goal_updated_controller_bt_node
      - navigo_is_battery_low_condition_bt_node
      - navigo_navigate_through_poses_action_bt_node
      - navigo_navigate_to_pose_action_bt_node
      - navigo_remove_passed_goals_action_bt_node
      - navigo_planner_selector_bt_node
      - navigo_path_controller_selector_bt_node
      - navigo_goal_checker_selector_bt_node
      - navigo_path_controller_cancel_bt_node
      - navigo_path_longer_on_approach_bt_node
      - navigo_wait_cancel_bt_node
      - navigo_spin_cancel_bt_node
      - navigo_back_up_cancel_bt_node
      - navigo_assisted_teleop_cancel_bt_node
      - navigo_drive_on_heading_cancel_bt_node
      - navigo_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "navigo_behaviors/Spin"
    backup:
      plugin: "navigo_behaviors/BackUp"
    drive_on_heading:
      plugin: "navigo_behaviors/DriveOnHeading"
    wait:
      plugin: "navigo_behaviors/Wait"
    assisted_teleop:
      plugin: "navigo_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.00
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.315,0.18],[0.315,-0.18],[-0.315,-0.18],[-0.315,0.18]]"
      transform_tolerance: 1.00
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "navigo_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.50
      obstacle_layer:
        plugin: "navigo_costmap_2d::ObstacleLayer"
        # Temporary outdoor test: lidar local avoidance off so TF-stale
        # costmap painting cannot weave the robot off the GPS line.
        enabled: False
        footprint_clearing_enabled: true
        observation_persistence: 0.3
        observation_sources: scan
        scan:
          topic: /laser_scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          # Input scan has calibrated robot-body returns removed upstream.
          obstacle_min_range: 0.18
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.315,0.18],[0.315,-0.18],[-0.315,-0.18],[-0.315,0.18]]"
      transform_tolerance: 1.00
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "navigo_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        footprint_clearing_enabled: True
        restore_cleared_footprint: True
      # Outdoor GPS patrol must not paint lidar hits onto the global map.
      # That is what made NavFn refuse a valid RTK waypoint (点7).
      # Local costmap + collision_monitor keep real-time lidar avoidance.
      inflation_layer:
        plugin: "navigo_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: " "

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    odom_topic: /odom/nav2
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "navigo_navfn_planner/NavfnPlanner"
      # Occupancy planning can still try; GPS patrol falls back to a straight line.
      tolerance: 2.0
      use_astar: false
      allow_unknown: true
      allow_straight_line_fallback: true
      prefer_straight_line: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: "/odom/nav2"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "navigo_path_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "navigo_path_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "navigo_path_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      # Patrol routes use waypoints as pass-through points. Do not require the
      # robot to match each waypoint's yaw, otherwise it can stall while turning.
      yaw_goal_tolerance: 3.14
      required_yaw_goal_tolerance: 0.25
    # MPPI parameters
    FollowPath:
      plugin: "navigo_mppi_controller::MPPIController"
      # Candidate/optimal trajectory markers on /trajectories only. Keep it off:
      # rebuilding them at controller_frequency costs thousands of Marker
      # constructions per cycle. /transformed_global_plan (the local segment
      # being tracked, which navigation_rosbag.sh records) is published
      # regardless of this flag.
      visualize: false
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.2
      # GPS straight-line paths are 0.25 m. Keep yaw noise well below wz_max so
      # MPPI does not sample bang-bang left/right turns on an already-straight path.
      # Patrol cruise is applied by Edge Agent (0.30 / 0.35); keep the YAML
      # fallback in the same range so idle Nav2 is not more aggressive.
      wz_std: 0.08
      vx_max: 0.30
      vx_min: -0.12
      vy_max: 0.5
      wz_max: 0.35
      ax_max: 1.0
      ay_max: 1.0
      ax_min: -1.0
      az_max: 0.8
      iteration_count: 1
      prune_distance: 2.0   #1.7
      transform_tolerance: 1.00
      temperature: 0.3
      gamma: 0.015 #0.015
      motion_model: "DiffDrive"
      # Dead knobs: no code in navigo_mppi_controller reads either name. The
      # marker switch is `visualize` above.
      visualize_all_sampled_traj: false
      visualize_optimized_traj: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.1667
      critics: [ "ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "GoalAngleCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic" ] #
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        # Patrol waypoint yaw is 0 (east). Requiring that heading within 0.5 m
        # of every pass-through point makes the robot reverse and spin in place.
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        # Do not over-penalize a turn around a temporary obstacle.
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: false
        cost_power: 2
        # Was 35: outdoor grass/scan noise made MPPI weave off the RTK path.
        cost_weight: 18.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: false
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.20
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # Was 20, tuned for NavFn 0.05 m points (~1 m). Straight-line GPS paths
        # are 0.25 m, so 20 points delayed alignment until ~5 m and the dog weaved.
        offset_from_furthest: 4
        # Path yaw from hand-clicked vias weaves even when XY is almost straight.
        use_path_orientations: false
      PathFollowCritic:
        enabled: false
        cost_power: 1
        cost_weight: 10.0 # 25
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        # Was 1.0 (~57 deg): heading already "close enough" skipped this critic
        # on a straight GPS line, so sampled yaw commands were not pulled back.
        max_angle_to_furthest: 0.40
        mode: 0
        forward_preference: true
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0


smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: [ "simple_smoother" ]
    simple_smoother:
      plugin: "navigo_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odom/nav2
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "navigo_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_optimizer:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.5]
    min_velocity: [-0.12, -0.5, -0.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [1.5, 1.0, 1.5]
    max_decel: [-1.5, -1.0, -1.5]
    odom_topic: "/odom/nav2"
    odom_duration: 0.1
    use_realtime_priority: false
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 1.0
    source_timeout: 1.0
    base_shift_correction: false
    stop_pub_timeout: 2.0
    stop_confirmation_cycles: 1
    allow_rotation_recovery: true
    allow_reverse_recovery: true
    localization_topic: "/localization_info"
    localization_timeout: 2.00
    require_healthy_localization: true
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      # Last-resort collision brake. Start in front of the body so lidar zero
      # returns and self-reflections do not trigger an emergency stop.
      points: [0.90, 0.22, 0.90, -0.22, 0.55, -0.22, 0.55, 0.22]
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: [1.20, 0.30, 1.20, -0.30, 0.55, -0.30, 0.55, 0.30]
      action_type: "slowdown"
      max_points: 5
      slowdown_ratio: 0.70
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/laser_scan"
      enabled: true

/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 2
    max_iteration: 3
    filter_size_surf: 0.15
    filter_size_map: 0.15
    cube_side_length: 1000.0
    common:
        lid_topic:  "/front_lidar"
        imu_topic:  "/front_lidar/imu"
        gnss_topic: "/fix"
        enu_odom_topic: "/gnss/enu_odom"
        time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
        time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
    frontend:
        # Navigation starts a second mapping process with this true. Formal
        # mapping keeps the default false so loop/backend/map IO stay on.
        odometry_only: false
        odometry_topic: "/odom/lio_odom"
    preprocess:
        lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
        scan_line: 4
        blind: 0.5
        # Launch profiles override this to 10 m indoors and 25 m outdoors.
        max_range: 10.0
        # Keep the front 240 degrees, i.e. mask only the rear +/-60 degree
        # sector. Mapping and navigation LIO use the same scan geometry;
        # the independent obstacle LaserScan path remains full 360 degrees.
        fov_degree: 240.0
        timestamp_unit: 3
        scan_rate: 10
    mapping:
        acc_cov: 0.1
        gyr_cov: 0.1
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001
        # Local-map cube size hint in original FAST-LIO; it does not crop scans.
        fov_degree:    360.0
        det_range:     100.0
        extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
        extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
        extrinsic_R: [ 1., 0., 0.,
                    0., 1., 0.,
                    0., 0., 1.]
    imu_init:
        # Keep the robot stationary for roughly three seconds at 200 Hz.
        sample_count: 600
        max_acc_variance: 0.5
        max_gyro_variance: 0.05
    gnss_fusion:
        # Legacy master gate. RTK never rewrites the FAST-LIO front-end pose;
        # quality-gated ENU measurements enter only the GTSAM backend.
        enable: true
        # Edge Agent writes this after the outdoor ENU origin lock (RTK position
        # FIX, about 3 s). Indoor mapping ignores a missing file.
        origin_file: /home/dogrobot/runtime/nx-edge/data/jszr/map/gnss_origin.yaml
        max_age: 1.5
        max_horizontal_std: 1.5
        min_status: 1
        lever_arm_base: [ -0.05, 0.0, 0.15 ]
        alignment_min_samples: 20
        alignment_min_baseline: 15.0
        alignment_max_rms: 1.5
        alignment_max_yaw_change_deg: 3.0
        alignment_required_fits: 3
        # Dual-antenna heading locks ENU-map yaw only after formal capture
        # starts (operator confirmed the 60 s heading review). Locking during
        # warmup uses slam_yaw≈0 and then fights LIO after the review spin.
        # Trajectory fitting remains the fallback when heading is unavailable.
        use_heading: true
        # Receiver primary-to-secondary baseline points opposite base_link +X.
        heading_offset_deg: 180.0
        heading_min_baseline_m: 0.20
        heading_max_std_deg: 5.0
        heading_max_age: 1.5
    odom_guard:
        # Disabled for live mapping until the lower-controller timestamp is fixed.
        # Offline rosbag replay enables this as a translation sanity constraint.
        enable: false
        topic: "/odom/mc_odom"
        max_speed: 2.0
        max_vertical_speed: 0.10
        max_lidar_correction: 0.35
        max_lidar_z_correction: 0.03
        max_lidar_rotation: 0.35
        max_abs_z_from_start: 10.0
    health_guard:
        max_frame_translation: 1.5
        max_speed: 3.0
        max_abs_z: 5.0
        max_frame_z: 1.0
        warn_speed: 1.8
        # Absolute map Z is not a divergence signal because outdoor routes include slopes.
        warn_abs_z: 0.0
        pose_guard_frames: 3
        no_effective_points_limit: 10
    ground_filter:
        # Gravity-constrained plane removal runs after IMU deskew and before
        # the FAST-LIO laser update. Failure is fail-open and never stops SLAM.
        enable: true
        distance_threshold_m: 0.08
        max_tilt_deg: 20.0
        min_inliers: 80
        min_sensor_height_m: 0.20
        max_sensor_height_m: 1.20
        clearance_m: 0.15
    dynamic_filter:
        # Preserve the raw map. Transient obstacles are removed explicitly in
        # the platform's manual map cleanup workflow after saving.
        enable: false
        voxel_size: 0.20
        min_scan_observations: 1
        # Partition voxel evidence on disk so long routes do not grow an
        # unbounded in-memory observation table during mapping or export.
        shard_count: 64
    keyframe_record:
        enable: true
        min_distance_m: 0.5
        min_yaw_rad: 0.35
        # Keep observing a stationary scene so people moving past a stopped dog can be removed later.
        max_interval_s: 1.0
        voxel_size_m: 0.15
        # Bound the background disk writer so storage stalls cannot consume RAM.
        max_queue_size: 8
    global_optimization:
        # Batch optimize FAST-LIO2 keyframe deltas, standard IMU preintegration,
        # RTK and Scan-Context loops. No NDT registration runs in this stage.
        # First save always exports the raw LIO cloud as map.pcd/map_raw.pcd.
        # IMU acceleration is calibrated to m/s^2 and gravity is modeled in the
        # GTSAM pose/velocity/bias state instead of as a Pose3-between delta.
        enable: true
        max_iterations: 80
        prior_translation_sigma: 0.01
        prior_rotation_sigma_rad: 0.01
        # Legacy key names: covariance for the FAST-LIO2 keyframe-between factor.
        ndt_translation_sigma: 0.15
        ndt_rotation_sigma_rad: 0.08
        imu_accelerometer_noise_sigma: 0.10
        imu_gyroscope_noise_sigma: 0.10
        imu_integration_noise_sigma: 0.0001
        imu_accel_bias_random_walk_sigma: 0.0001
        imu_gyro_bias_random_walk_sigma: 0.0001
        imu_velocity_prior_sigma: 0.30
        imu_bias_prior_sigma: 0.10
        # Drop only IMU intervals whose endpoint FAST-LIO velocities cannot
        # explain the observed FAST-LIO pose displacement. The pose chain stays.
        imu_kinematic_gate_max_residual_mps: 0.25
        gravity_magnitude: 9.81
        # Outdoor launch keeps this enabled; the indoor state command forces
        # GPS off while retaining the standard IMU pose/velocity/bias factors.
        use_gps: true
        use_imu_factor: true
        # Automatic loop application is disabled by default for every scene.
        # unified_mapping.launch.py only overrides this from the explicit
        # ROAMERX_AUTO_LOOP_OPTIMIZATION deployment policy.
        use_loop: false
        # XY-only RTK jump gate. GNSS altitude is not applied to the map.
        max_pose_jump_m: 25.0
        max_abs_z_change_m: 1.5
        rtk_position_sigma_floor: 0.20
        rtk_heading_sigma_floor_rad: 0.035
        loop_translation_sigma: 0.10
        loop_rotation_sigma_rad: 0.08
        robust_huber_k: 1.345
    publish:
        path_en: true                # true: publish Path
        map_en: false                 # true: publish Map cloud
        world_points_en:  true       # false: close all the point cloud output
        body_points_en: true  # true: output the point cloud scans in IMU-body-frame
    storage:
      data_path: "/home/dogrobot/runtime/nx-edge/data/jszr/map"
    pcd2pgm:
      file_name : "map"
      # 2D navigation map should only contain obstacles that can collide with the dog.
      # Higher indoor structures are kept in the PCD for localization but not projected into PGM.
      # Four-legged navigation deliberately traverses continuous low terrain
      # up to 50 cm.  Keep it out of the 2D obstacle projection; taller
      # returns continue to form hard navigation obstacles.
      thre_z_min : 0.50
      thre_z_max : 0.75
      flag_pass_through : 0
      map_resolution : 0.05
      # Reject pathological SLAM bounds before creating an oversized raster.
      max_grid_cells: 200000000
      # Retain sparse structure when nearby 5cm cells support each other, but
      # reject isolated returns. Crop far returns around the driven trajectory.
      min_points_per_cell: 3
      support_radius_cells: 1
      projection_padding_m: 25.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roamerx-dev-agent"
version = "0.1.0"
description = "MQTT bridge for remote Codex CLI development"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["roamerx_dev_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

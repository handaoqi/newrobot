[Service]
# Reset the package's default SenseVoice command, then use the fully downloaded
# local Fun-ASR-Nano checkpoint.  The service API expects requests to use the
# `custom` model selector when --model-path is set.
ExecStart=
ExecStart=/home/dogrobot/runtime/nx-edge/data/voice/venv/bin/python3 /home/dogrobot/runtime/nx-edge/data/voice/venv/bin/funasr-server --host 127.0.0.1 --port 18080 --device cuda:0 --model fun-asr-nano --model-path /home/dogrobot/runtime/nx-edge/data/voice/models/models/FunAudioLLM--Fun-ASR-Nano-2512
TimeoutStartSec=300

name: ${COMPOSE_PROJECT_NAME:-roamerx-platform}

x-backend: &backend
  build:
    context: ${ROAMERX_SOURCE_ROOT:-../..}/platform/backend
  image: roamerx/platform-backend:local
  env_file:
    - ./conf/platform.env
  environment:
    SQLITE_DB_PATH: /runtime/db/db.sqlite3
    DJANGO_MEDIA_ROOT: /runtime/media
    MQTT_HOST: mqtt
    MQTT_PORT: "1883"
    MQTT_TLS_ENABLED: "false"
    VALIDATION_OBJECT_STORE_BACKEND: s3
    VALIDATION_OBJECT_STORE_ENDPOINT: http://validation-storage:9000
    VALIDATION_OBJECT_STORE_PUBLIC_ENDPOINT: ${VALIDATION_OBJECT_STORE_PUBLIC_ENDPOINT:-http://localhost:9002}
    VALIDATION_OBJECT_STORE_BUCKET: ${VALIDATION_OBJECT_STORE_BUCKET:-roamerx-validation}
    VALIDATION_OBJECT_STORE_ACCESS_KEY: ${VALIDATION_OBJECT_STORE_ACCESS_KEY:-roamerx-validation}
    VALIDATION_OBJECT_STORE_SECRET_KEY: ${VALIDATION_OBJECT_STORE_SECRET_KEY:-change-validation-storage-secret}
    VALIDATION_GATEWAY_TOKEN: ${VALIDATION_GATEWAY_TOKEN:-change-validation-gateway-secret}
  volumes:
    - ./data/backend/db:/runtime/db
    - ./data/backend/media:/runtime/media
    - ./data/backend/logs:/runtime/logs
  restart: unless-stopped

services:
  backend:
    <<: *backend
    container_name: roamerx-platform-api
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py initialize_platform &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --worker-class gthread --workers 3 --threads 8 --timeout 300
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/maps/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s

  device-worker:
    <<: *backend
    container_name: roamerx-device-worker
    command: ["python", "manage.py", "run_device_worker"]
    depends_on:
      backend:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  patrol-scheduler:
    <<: *backend
    container_name: roamerx-patrol-scheduler
    command: ["python", "manage.py", "run_patrol_scheduler", "--interval", "10"]
    depends_on:
      backend:
        condition: service_healthy

  patrol-loop-supervisor:
    <<: *backend
    container_name: roamerx-patrol-loop-supervisor
    command: ["python", "manage.py", "run_patrol_loop_supervisor", "--interval", "1"]
    depends_on:
      backend:
        condition: service_healthy

  validation-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: roamerx-validation-storage
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${VALIDATION_OBJECT_STORE_ACCESS_KEY:-roamerx-validation}
      MINIO_ROOT_PASSWORD: ${VALIDATION_OBJECT_STORE_SECRET_KEY:-change-validation-storage-secret}
    ports:
      - "${VALIDATION_OBJECT_STORE_PORT:-9002}:9000"
      - "127.0.0.1:${VALIDATION_OBJECT_STORE_CONSOLE_PORT:-9003}:9001"
    volumes:
      - ./data/validation-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8

  validation-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - ./conf/platform.env
    depends_on:
      validation-storage:
        condition: service_healthy
    volumes:
      - ./conf/validation-storage-cors.xml:/cors.xml:ro
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set validation http://validation-storage:9000
        "$${VALIDATION_OBJECT_STORE_ACCESS_KEY:-roamerx-validation}"
        "$${VALIDATION_OBJECT_STORE_SECRET_KEY:-change-validation-storage-secret}";
        mc mb --ignore-existing "validation/$${VALIDATION_OBJECT_STORE_BUCKET:-roamerx-validation}";
        mc anonymous set none "validation/$${VALIDATION_OBJECT_STORE_BUCKET:-roamerx-validation}";
        mc cors set "validation/$${VALIDATION_OBJECT_STORE_BUCKET:-roamerx-validation}" /cors.xml
    restart: "no"

  validation-gateway:
    build:
      context: ${ROAMERX_SOURCE_ROOT:-../..}/platform/validation-gateway
    image: roamerx/validation-gateway:local
    container_name: roamerx-validation-gateway
    restart: unless-stopped
    environment:
      ROAMERX_PLATFORM_INTERNAL_URL: http://backend:8000
      ROAMERX_VALIDATION_GATEWAY_PORT: "8765"
      ROAMERX_VALIDATION_GATEWAY_TOKEN: ${VALIDATION_GATEWAY_TOKEN:-change-validation-gateway-secret}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ${ROAMERX_SOURCE_ROOT:-../..}/platform/frontend
    image: roamerx/platform-frontend:local
    container_name: roamerx-platform-frontend
    restart: unless-stopped
    ports:
      - "${PLATFORM_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
      validation-gateway:
        condition: service_started
      zlmediakit:
        condition: service_started
    volumes:
      - ./install/lichtblick-web/dist:/usr/share/nginx/html/foxglove:ro

  mqtt:
    image: eclipse-mosquitto:2
    container_name: roamerx-mqtt
    restart: unless-stopped
    env_file:
      - ./conf/platform.env
    ports:
      - "${MQTT_EXTERNAL_PORT:-1884}:1883"
    volumes:
      - ./conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./conf/mosquitto.passwd:/mosquitto/config/passwd:ro
      - ./data/mqtt:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 8

  zlmediakit:
    image: zlmediakit/zlmediakit:master
    container_name: roamerx-zlmediakit
    restart: unless-stopped
    ports:
      - "${RTMP_EXTERNAL_PORT:-1935}:1935"
      - "${ZLM_HTTP_EXTERNAL_PORT:-8080}:80"
      - "8554:554"
      - "10000:10000/tcp"
      - "10000:10000/udp"
      - "8000:8000/udp"
      - "9000:9000/udp"
    volumes:
      - ./data/zlmediakit:/opt/media/bin/www/record

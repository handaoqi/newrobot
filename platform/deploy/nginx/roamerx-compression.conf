# Managed by platform/scripts/deploy_cloud_platform.sh --with-nginx.
# This file is included by the active nginx http/server configuration.  Keep
# gzip on/off in the host configuration so this snippet never duplicates it.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    text/javascript
    text/css
    image/svg+xml;

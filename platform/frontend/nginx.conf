server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"status":"ok"}';
    }

    location = /release.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Type application/json always;
    }

    location = /modules.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Type application/json always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Pinned, self-hosted Lichtblick bundle. The runtime installer places the
    # immutable dist tree on this mount; relative asset URLs keep it working
    # below /foxglove/ without a separate public service or account. Keep the
    # bundle outside the SPA fallback: returning the platform index for a
    # missing Lichtblick asset makes the iframe look like a slow boot and hides
    # a broken deployment behind HTTP 200 responses.
    location = /foxglove {
        return 301 /foxglove/$is_args$args;
    }

    location = /foxglove/ {
        try_files /foxglove/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /foxglove/index.html {
        try_files /foxglove/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /foxglove/ {
        # nginx's system mime.types often predates WebAssembly. Lichtblick uses
        # instantiateStreaming(), which requires the proper MIME type instead
        # of the default application/octet-stream.
        types {
            application/javascript js mjs;
            application/json json map;
            application/wasm wasm;
            font/ttf ttf;
            font/woff woff;
            font/woff2 woff2;
            image/gif gif;
            image/jpeg jpeg jpg;
            image/png png;
            image/svg+xml svg;
            image/webp webp;
            text/css css;
        }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Authentication is performed by the gateway before it connects to a
    # private Runner. Query strings contain a short-lived user session token,
    # so this location must never be written to the access log.
    location /validation-ws/ {
        proxy_pass http://validation-gateway:8765/validation-ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /live/ {
        proxy_pass http://zlmediakit/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}

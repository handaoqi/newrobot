# Include this server fragment in the existing HTTP vhost. It only changes
# the frontend root; API, media, live and TLS locations remain host-owned.
location = /healthz { proxy_pass http://127.0.0.1:13000/healthz; proxy_set_header Host $host; }
location = /release.json { proxy_pass http://127.0.0.1:13000/release.json; proxy_set_header Host $host; }
location = /modules.json { proxy_pass http://127.0.0.1:13000/modules.json; proxy_set_header Host $host; }
location /assets/ { proxy_pass http://127.0.0.1:13000/assets/; proxy_set_header Host $host; }
location / { proxy_pass http://127.0.0.1:13000; proxy_set_header Host $host; }

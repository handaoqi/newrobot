[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roamerx-edge-agent"
version = "0.1.0"
description = "RoamerX P0 MQTT/ROS2 edge gateway"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "numpy>=1.24,<3",
]

[project.scripts]
roamerx-semantic-projection = "roamerx_edge.semantic_projection_node:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["roamerx_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

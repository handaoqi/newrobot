robot:
  id: "rx-001"
  agent_version: "0.1.0"
  current_map_id: "site-a-main"
  current_map_version: "v1"

mqtt:
  host: "center.example.com"
  port: 8883
  username: "rx-001"
  password: ""
  ca_file: "/etc/roamerx/ca.crt"
  cert_file: "/etc/roamerx/rx-001.crt"
  key_file: "/etc/roamerx/rx-001.key"
  keepalive_seconds: 20
  session_expiry_seconds: 86400

ros:
  localization_topic: "/localization_info"
  scan_matching_status_topic: "/status"
  odometry_topic: "/odom/localization_odom"
  battery_topic: ""
  follow_waypoints_action: "/follow_waypoints"

ros_callback_optimization:
  # One switch restores the historical direct-in-callback processing path.
  enabled: true
  metrics_enabled: true
  metrics_interval_seconds: 10
  imu_sample_rate_hz: 25
  odometry_telemetry_rate_hz: 10
  scan_processing_rate_hz: 10
  scan_matching_full_detail_interval_seconds: 10

telemetry:
  status_interval_seconds: 2
  heartbeat_interval_seconds: 10
  trajectory_flush_seconds: 5
  trajectory_batch_size: 20
  system_probe_interval_seconds: 10
  cooling_system_probe_interval_seconds: 15
  system_probe_stale_seconds: 30
  battery_ssh_host: "3588"
  modem_at_device: "/dev/ttyUSB2"
  charging_current_threshold_ma: 300
  charging_overheat_threshold_c: 49
  battery_rated_capacity_wh: 216
  charger_speaker_sink: "alsa_output.usb-SD_Audio_Device_2502171729-00.analog-stereo"
  nx_speaker_card: 0
  nx_speaker_control: "PCM"

safety:
  stop_speed_threshold_mps: 0.03
  localization_stable_seconds: 3.0
  localization_loss_samples: 5
  ndt_failure_score: 0.5
  ndt_failure_samples: 3
  localization_optimal_ndt_score: 0.01
  localization_quick_search_seconds: 30.0
  localization_rtk_max_drift_m: 0.30
  localization_rtk_required_samples: 3
  localization_recovery_attempts: 3
  localization_recovery_retry_seconds: 5.0
  localization_recovery_cycle_seconds: 30.0
  localization_recovery_max_cycles: 3
  stop_confirmation_seconds: 1.0
  standup_confirmation_timeout_seconds: 12.0
  low_battery_percent: 20
  # Ordinary stop-and-confirm points may skip final yaw inside this radius.
  arrival_degraded_tolerance_m: 0.60
  # Used only at the final docking contact waypoint.
  docking_goal_tolerance_m: 0.08
  docking_goal_yaw_tolerance_rad: 0.0872665
  # Final-yaw XY adjustment has no distance/time cap. These settings retain a
  # rolling safety corridor and allow brief scan/localization recovery.
  arrival_adjust_clearance_lookahead_m: 0.50
  arrival_adjust_speed_mps: 0.08
  arrival_adjust_yaw_rate_rps: 0.10
  arrival_adjust_scan_max_age_seconds: 0.50
  arrival_adjust_safety_grace_seconds: 2.0

obstacle_speech:
  enabled: true
  obstacle_clear_seconds: 3.0
  no_progress_seconds: 5.0
  min_progress_m: 0.5
  obstacle_max_distance_m: 0.9
  collision_limit_ratio: 0.6
  minimum_blocked_task_seconds: 300.0
  navigation_retry_seconds: 5.0

waypoint_speech:
  status_dir: /home/dogrobot/runtime/nx-edge/data/audio-status
  timeout_seconds: 120.0
  poll_interval_seconds: 0.2
  block_navigation: false

storage:
  sqlite_path: "/var/lib/roamerx-edge/edge.db"
  trajectory_outbox_limit: 720

media:
  upload_url: "https://center.example.com/api/device/media/upload/"
  map_upload_url: "https://center.example.com/api/device/maps/upload/"
  device_id: "rx-001"
  device_key: ""
  map_upload_timeout_seconds: 1800

mapping:
  # Always retain loop candidates for Map Management review, but do not warp
  # the exported navigation map automatically.
  auto_loop_optimization_enabled: false
  localization_scan_context_check_binary: /home/dogrobot/robot/install/localization/lib/localization/localization_scan_context_check
  pcd2grid_binary: /home/dogrobot/robot/install/robot_slam/lib/robot_slam/pcd2grid_streaming
  log_dir: /tmp/roamerx_mapping_logs
  map_dir: "/home/dogrobot/runtime/nx-edge/data/jszr/map"
  ros_setup: "/opt/ros/humble/setup.bash"
  workspace_setup: "/home/dogrobot/robot/install/setup.bash"
  slam_binary: "/home/dogrobot/robot/install/robot_slam/lib/robot_slam/mapping"
  enu_binary: "/home/dogrobot/robot/install/robot_slam/lib/robot_slam/slam_enu_converter"
  slam_params_file: "/home/dogrobot/robot/install/robot_slam/share/robot_slam/config/config.yaml"
  unified_launch_file: "/home/dogrobot/robot/install/robot_slam/share/robot_slam/launch/unified_mapping.launch.py"
  mapping_unit_file: "/etc/systemd/system/roamerx-mapping.service"
  mapping_session_params_file: "/home/dogrobot/runtime/nx-edge/conf/mapping-origin-session.yaml"
  mapping_environment_file: "/home/dogrobot/runtime/nx-edge/conf/mapping-session.env"
  slam_command: "exec ros2 launch robot_slam unified_mapping.launch.py"
  mapping_unit: "roamerx-mapping.service"
  deployment_manifest: "/home/dogrobot/runtime/nx-edge/conf/mapping-deployment.json"
  deployment_manifest_required: true
  navigation_script: "/home/dogrobot/robot/script/robot/start_navigation_real.sh"
  service_name: "/slam_state_service"
  service_type: "robots_dog_msgs/srv/MapState"
  start_service: "/slam/start_mapping"
  start_service_type: "std_srvs/srv/Trigger"
  save_service: "/slam/save_map"
  save_service_type: "std_srvs/srv/Trigger"
  start_data: 3
  warmup_data: 6
  indoor_warmup_data: 7
  save_data: 5
  # Empty paths derive from map_dir, yielding gnss_origin.yaml and mapping_workflow.json.
  origin_file: ""
  origin_state_file: ""
  origin_lock_duration_seconds: 10.0
  origin_lock_max_spread_m: 0.02
  origin_lock_sample_interval_seconds: 1.0
  origin_lock_ttl_seconds: 1800
  origin_fix_topic: "/fix"
  origin_rtk_topic: "/rtk_pvh"
  origin_ntrip_status_topic: "/rtk/ntrip_status"
  heading_min_baseline_m: 0.20
  heading_max_std_deg: 5.0
  heading_max_age_seconds: 1.5
  # Primary-to-secondary antenna heading is opposite the robot forward axis.
  heading_offset_deg: 180.0
  command_timeout_seconds: 15
  save_wait_seconds: 7200
  dynamic_filter_enabled: false
  dynamic_filter_voxel_size_m: 0.12
  dynamic_filter_min_points_per_voxel: 3
  dynamic_filter_clear_radius_cells: 1
  visibility_filter_enabled: false
  visibility_filter_voxel_size_m: 0.3
  visibility_filter_min_free_observations: 1
  visibility_filter_max_hit_observations: 10
  visibility_filter_max_source_bytes: 268435456
  visibility_filter_output_suffix: keyframe_visibility_loose03x
  auto_activate_uploaded_map: true
  upload_point_cloud: true
  preview_max_size: 1200
  rosbag_script: "/home/dogrobot/robot/script/robot/mapping_rosbag.sh"
  rosbag_stop_timeout_seconds: 45
  divergence_post_record_seconds: 3.0
  sensor_start_script: "/home/dogrobot/robot/script/robot/ensure_mapping_sensors.sh"
  sensor_start_timeout_seconds: 40

navigation_stack:
  script_path: "/home/dogrobot/robot/script/robot/start_navigation_real.sh"
  command_timeout_seconds: 45
  rosbag_script: "/home/dogrobot/robot/script/robot/navigation_rosbag.sh"
  rosbag_stop_timeout_seconds: 45
  boundary_filter_dir: "/home/dogrobot/runtime/nx-edge/data/navigation_boundary"

teleop_control:
  script_path: "/home/dogrobot/robot/script/robot/start_teleop_control.sh"
  command_timeout_seconds: 20

person_follow:
  # Written atomically by roamerx-bike-bot; never read from the cloud in the control loop.
  detection_snapshot_path: "/run/roamerx/person_detections.json"
  detection_stale_seconds: 1.0
  control_interval_seconds: 0.15
  obstacle_stop_distance_m: 0.8

sensor_control:
  lidar_restart_script: "/home/dogrobot/robot/script/robot/restart_livox_sensor.sh"
  rtk_restart_script: "/home/dogrobot/robot/script/robot/start_rtk_ntrip.sh"
  command_timeout_seconds: 30

charge_control:
  remote_host: "3588"
  service_name: "roamerx-charge-pile"
  working_directory: "/home/firefly/charge_pile_v1.0.3b/charge_pile_xg_lib_v1.0.3b/dog_send_three_states"
  executable: "/home/firefly/charge_pile_v1.0.3b/charge_pile_xg_lib_v1.0.3b/dog_send_three_states/dog_lying_down"
  return_executable: "/home/firefly/charge_pile_v1.0.3b/charge_pile_xg_lib_v1.0.3b/dog_send_three_states/dog_returning"
  controller_service_name: "robot-launch.service"
  arbiter_path: "/usr/local/sbin/roamerx-charge-pile-arbiter"
  arc_platform_egg: "arc_platform"
  ros_setup: "/opt/ros/humble/setup.bash"
  ros_domain_id: 24
  rmw_implementation: "rmw_zenoh_cpp"
  arc_state_topic: "/arc/arc_state"
  dock_state_topic: "/arc/dock_state"
  pile_command_topic: "/arc/pile_ele_cmd"
  pile_result_topic: "/arc/pile_ele_result"
  arc_command_timeout_seconds: 18
  command_timeout_seconds: 90
  full_battery_percent: 95
  full_confirmation_samples: 3
  low_battery_start_percent: 20
  low_battery_confirmation_samples: 2
  low_battery_start_cooldown_seconds: 60
  manual_disconnect_auto_charge_pause_seconds: 300
  cooling_stop_eggs: [push_image, spline_daemon, motion_control, dog_task, imu_daemon, ecal2ros, monitor, zenoh_route]
  normal_start_eggs: [arc_platform, monitor, time_sync, spline_daemon, motion_control, zenoh_route, dog_task, push_image, ecal2ros, imu_daemon]
  cooling_stop_services: [rkaiq_3A.service, rknn_server.service, lightdm.service]
  normal_start_services: [rkaiq_3A.service, rknn_server.service, lightdm.service]

power_mode:
  state_path: /home/dogrobot/runtime/nx-edge/data/edge-agent/power_mode.json
  cooling_marker_path: /home/dogrobot/runtime/nx-edge/data/edge-agent/cooling_standby
  monitoring_service: roamerx-bike-bot.service
  navigation_script: /home/dogrobot/robot/script/robot/start_navigation_real.sh
  normal_start_timeout_seconds: 240
  always_on_services: [roamerx-dev-agent.service, roamerx-robot-mcp.service, roamerx-zenoh.service, roamerx-5g-share.service]
  controller_host: "3588"
  controller_always_eggs: [power_daemon]
  controller_runtime_eggs: [time_sync, arc_platform, monitor, spline_daemon, motion_control, zenoh_route, dog_task, push_image, ecal2ros, imu_daemon]
  controller_always_services: [robot-launch.service]
  controller_runtime_services: [rkaiq_3A.service, rknn_server.service, lightdm.service]

audio_control:
  remote_host: "3588"
  remote_sink: "alsa_output.usb-SD_Audio_Device_2502171729-00.analog-stereo"
  nx_card: 2
  nx_control: "PCM"
  command_timeout_seconds: 10

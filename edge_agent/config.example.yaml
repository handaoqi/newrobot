robot:
  id: "rx-001"
  agent_version: "0.1.0"
  current_map_id: "site-a-main"
  current_map_version: "v1"

mqtt:
  host: "center.example.com"
  port: 8883
  username: "rx-001"
  password: ""
  ca_file: "/etc/roamerx/ca.crt"
  cert_file: "/etc/roamerx/rx-001.crt"
  key_file: "/etc/roamerx/rx-001.key"
  keepalive_seconds: 20
  session_expiry_seconds: 86400

ros:
  localization_topic: "/localization_info"
  scan_matching_status_topic: "/status"
  odometry_topic: "/odom/localization_odom"
  battery_topic: ""
  follow_waypoints_action: "/follow_waypoints"

telemetry:
  status_interval_seconds: 2
  heartbeat_interval_seconds: 10
  trajectory_flush_seconds: 5
  trajectory_batch_size: 20

safety:
  stop_speed_threshold_mps: 0.03
  stop_confirmation_seconds: 1.0
  low_battery_percent: 20

storage:
  sqlite_path: "/var/lib/roamerx-edge/edge.db"

media:
  upload_url: "https://center.example.com/api/device/media/upload/"
  map_upload_url: "https://center.example.com/api/device/maps/upload/"
  device_id: "rx-001"
  device_key: ""

mapping:
  log_dir: /tmp/roamerx_mapping_logs
  map_dir: "/home/robot/.jszr/map"
  ros_setup: "/opt/ros/humble/setup.bash"
  workspace_setup: "~/genisom_roamerx_open/install/setup.bash"
  slam_command: "ros2 run robot_slam mapping --ros-args --params-file $HOME/genisom_roamerx_open/install/robot_slam/share/robot_slam/config/config.yaml"
  service_name: "/slam_state_service"
  service_type: "robots_dog_msgs/srv/MapState"
  start_data: 3
  save_data: 5
  command_timeout_seconds: 15
  save_wait_seconds: 7200
  dynamic_filter_enabled: false
  dynamic_filter_voxel_size_m: 0.12
  dynamic_filter_min_points_per_voxel: 3
  dynamic_filter_clear_radius_cells: 1
  visibility_filter_enabled: false
  visibility_filter_voxel_size_m: 0.3
  visibility_filter_min_free_observations: 1
  visibility_filter_max_hit_observations: 10
  visibility_filter_max_source_bytes: 268435456
  visibility_filter_output_suffix: keyframe_visibility_loose03x
  auto_activate_uploaded_map: true
  upload_point_cloud: false
  preview_max_size: 1200

navigation_stack:
  script_path: "/home/robot/genisom_roamerx_open/script/robot/start_navigation_real.sh"
  command_timeout_seconds: 45

teleop_control:
  script_path: "/home/robot/genisom_roamerx_open/script/robot/start_teleop_control.sh"
  command_timeout_seconds: 20

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-bot"
version = "0.1.0"
description = "Realtime bicycle detection and telemetry reporting for robot edge boards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "opencv-python>=4.9.0",
    "PyYAML>=6.0.1",
    "requests>=2.32.0",
    "ultralytics>=8.3.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
bike-bot = "bike_bot.main:main"
bike-bot-demo-server = "bike_bot.demo_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
